<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Ligações</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{URL}}/resources/css/dashboard.css" />

    <script src="{{URL}}/resources/js/dashboard.js"></script>
    <script>
      const queue = "{{queue}}";

      const API_URL = "{{URL}}/ajax/ligacoes/dash";
      let alertActive = false;
      const alertSound = new Audio("{{URL}}/resources/sounds/alarm.mp3");
      alertSound.preload = "auto";
      alertSound.load();
    </script>
  </head>
  <body>
    <div id="alertOverlay" class="alert-overlay"></div>
    <div id="ramalAlert" class="ramal-alert"></div>

    <div class="container-fluid dashboard">
      <div class="row g-4 h-100">
        <!-- LINHA SUPERIOR -->
        <div class="col-md-4">
          <div
            class="card card-custom p-4 text-center d-flex justify-content-center"
          >
            <h6 class="fw-bold">N. DE CHAMADAS EM ESPERA</h6>
            <div class="circle-progress mt-4" id="callsWaiting">
              <span>0</span>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div
            class="card card-custom p-4 text-center d-flex justify-content-center"
          >
            <h6 class="fw-bold">NÚM. DE AGENTES EM CHAMADA</h6>
            <div class="circle-progress mt-4" id="agentsOnCall">
              <span>0</span>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div
            class="card card-custom p-4 text-center d-flex justify-content-center"
          >
            <h6 class="fw-bold">AGENTES DISPONÍVEIS</h6>
            <div class="circle-progress mt-4" id="agentsAvailable">
              <span>0</span>
            </div>
          </div>
        </div>

        <!-- LINHA INFERIOR -->
        <div class="col-md-4">
          <div
            class="card card-custom card-blue p-4 text-center d-flex flex-column justify-content-center"
          >
            <h6 class="fw-bold">CHAMADAS OFERECIDAS</h6>
            <div class="big-number mt-3" id="callsOffered">0</div>
            <div class="subtitle">Chamadas Oferecidas</div>
          </div>
        </div>

        <div class="col-md-4">
          <div
            class="card card-custom card-blue p-4 text-center d-flex flex-column justify-content-center"
          >
            <h6 class="fw-bold">CHAMADAS ATENDIDAS</h6>
            <div class="big-number mt-3" id="callsAnswered">0</div>
            <div class="subtitle">Chamadas Atendidas</div>
          </div>
        </div>

        <div class="col-md-4">
          <div
            class="card card-custom p-4 text-center d-flex flex-column justify-content-center"
            id="lostCard"
          >
            <h6 class="fw-bold">CHAMADAS PERDIDAS</h6>
            <div class="big-number mt-3 text-dark" id="callsLost">0</div>
            <div class="subtitle">Chamadas Perdidas</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
